name: Build and Deploy

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --engine-strict --no-audit --no-fund

      - name: Lint and build
        run: npm run build

  # Preserve generated-file updates on the default branch. PR and feature
  # branch validation has no write token and cannot publish generated changes.
  build-and-commit:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --engine-strict --no-audit --no-fund

      - name: Lint and build
        run: npm run build

      - name: Commit and push generated files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add builds/source.min.js builds/tampermonkey_userscript/bm-enhanced.min.js builds/chrome_extension/content.js builds/chrome_extension/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "build: Minify JS and update versions [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
